<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Traveloop</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; border-radius: 10px 10px 0 0; }
    .content { background: #f9f9f9; padding: 30px; border-radius: 0 0 10px 10px; }
    .button { display: inline-block; background: #667eea; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    .footer { text-align: center; padding: 20px; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Welcome to Traveloop! 🌍</h1>
  </div>
  <div class="content">
    <p>Hi {{name}},</p>
    <p>Thanks for joining Traveloop! We're excited to help you discover amazing destinations and plan unforgettable trips.</p>
    <p>Start exploring now:</p>
    <a href="{{appUrl}}" class="button">Explore Traveloop</a>
    <p style="margin-top: 30px;">Happy travels!</p>
    <p>The Traveloop Team</p>
  </div>
  <div class="footer">
    <p>&copy; 2025 Traveloop. All rights reserved.</p>
    <p><a href="{{unsubscribeUrl}}">Unsubscribe</a></p>
  </div>
</body>
</html>
