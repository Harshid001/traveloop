name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [traveloop/BACKEND, traveloop/FRONTEND, traveloop/MOBILE]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -w ${{ matrix.workspace }}

      - name: Test
        run: npm test -w ${{ matrix.workspace }}

  backend-integration:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/traveloop_test
      JWT_SECRET: ci-test-jwt-secret-for-integration-tests-32chars+
      CLIENT_URL: http://localhost:5173
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run integration tests
        run: npm test -w traveloop/BACKEND

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: traveloop/BACKEND/Dockerfile
          push: false
          load: true
          tags: traveloop-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: traveloop/FRONTEND/Dockerfile
          push: false
          load: true
          tags: traveloop-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-for-integration-tests-32chars+
      MONGO_URI: mongodb://localhost:27017/traveloop_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate (lint + test + build)
        run: npm run validate